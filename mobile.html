<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <title>飙分 · 手机版</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
  <!-- 与桌面版完全相同的结构(同 ID),复用 src/ui.js,交互一致 -->
  <div id="app">
    <header id="topbar">
      <span class="brand">飙分</span>
      <span id="status">—</span>
      <button id="newgame" class="btn ghost">新牌局</button>
    </header>
    <section id="opponents"></section>
    <section id="table">
      <div id="captured" class="empty"></div>
      <div id="trick"></div>
      <div id="message"></div>
    </section>
    <section id="myhand">
      <div id="me-meta"></div>
      <div id="hand"></div>
    </section>
    <section id="actionbar"></section>
  </div>

  <div id="overlay" class="hidden"><div id="dialog"></div></div>

  <script type="module" src="src/ui.js"></script>
</body>
</html>
