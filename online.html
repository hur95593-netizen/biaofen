<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <title>飙分 · 联机</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/online.css">
</head>
<body>
  <!-- 与单机版同构(同 ID),渲染逻辑对齐 src/ui.js;数据来自服务器视图 -->
  <div id="app">
    <header id="topbar">
      <span class="brand">飙分</span>
      <span id="status">—</span>
      <span id="conn" class="conn off" title="连接状态"></span>
      <button id="leave" class="btn ghost sm">退出房间</button>
    </header>
    <section id="opponents"></section>
    <section id="table">
      <div id="captured" class="empty"></div>
      <div id="trick"></div>
      <div id="message"></div>
    </section>
    <section id="myhand">
      <div id="me-meta"></div>
      <div id="hand"></div>
    </section>
    <section id="actionbar"></section>
  </div>

  <div id="overlay" class="hidden"><div id="dialog"></div></div>
  <div id="toasts"></div>

  <script type="module" src="src/online.js"></script>
</body>
</html>
