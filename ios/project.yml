name: Biaofen
options:
  bundleIdPrefix: com.biaofen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  BiaofenCore:
    path: BiaofenCore
targets:
  Biaofen:
    type: application
    platform: iOS
    sources:
      - Biaofen
    dependencies:
      - package: BiaofenCore
    info:
      path: Biaofen/Info.plist
      properties:
        CFBundleDisplayName: 飙分
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        # 联机:允许 ws://(本地/局域网服务器无 TLS);云端建议用 wss://
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: 用于连接同一局域网内的飙分对战服务器
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.biaofen.app
        DEVELOPMENT_TEAM: BNNV62NJKQ
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
schemes:
  Biaofen:
    build:
      targets:
        Biaofen: all
    run:
      config: Debug
